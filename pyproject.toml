[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ds340w-repro"
version = "0.1.0"
description = "Reproducible OpenDelta LoRA/SST-2 experiment controls"
requires-python = ">=3.10,<3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = [
  "src",
  "vendor/OpenDelta",
  "vendor/OpenDelta/examples/legacies",
]
testpaths = ["tests"]
